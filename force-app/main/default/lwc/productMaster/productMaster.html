<template>
    <lightning-card title={cardTitle}>
        <template if:true={showFilterButton}>
            <lightning-button slot="actions" label="Filter" title="Filter" icon-name="action:filter" class="slds-m-left_x-small" onclick={handleOpenFilter}></lightning-button>
        </template>
        
        <template if:true={showCartIcon}>
            <a href="javascript:void(0)" slot="actions" onclick={handleOpenCart} class="slds-m-left_x-small">
                <lightning-icon icon-name="standard:webcart" alternative-text="webcart" title="webcart"></lightning-icon>
                <lightning-badge label={totalInCart}></lightning-badge>
            </a>
        </template>
    </lightning-card><br/>
    <c-product-filters></c-product-filters>
    <c-product-search default-category={defaultCategory}></c-product-search>
    <c-cart-data></c-cart-data>
</template>
